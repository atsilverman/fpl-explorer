# Club team-news graphics (Home → Team Graphics).
# GitHub drops most of these crons in practice (runs land ~every 2–8 h), so a
# run that starts near any kickoff stays alive and polls at fixed checkpoints
# around each KO (see POLL_OFFSETS_MIN in fetch_team_news.py) for up to ~5h45m.
# The next scheduled run queues behind it via the concurrency group, so
# matchdays chain into continuous coverage. Idle runs exit after one FPL fetch.
name: Refresh team news

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-team-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for upcoming kickoffs
        id: plan
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          next=$(python3 site/fetch_team_news.py --next-poll | tail -n1)
          echo "next=$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Install Tesseract (multi-image lineup OCR)
        if: steps.plan.outputs.next != 'none'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr

      - name: Poll team news around kickoffs
        if: steps.plan.outputs.next != 'none'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_if_changed() {
            if git diff --quiet -- site/team_news_data.js; then
              return 0
            fi
            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("site/index.html")
          text = path.read_text(encoding="utf-8")
          pat = re.compile(r'(src="team_news_data\.js\?v=)(\d+)(")')
          text, n = pat.subn(lambda m: f"{m.group(1)}{int(m.group(2)) + 1}{m.group(3)}", text)
          print("Bumped team_news_data.js" if n else "No cache param for team_news_data.js")
          path.write_text(text, encoding="utf-8")
          PY
            git add -A site/team-news site/team_news_data.js site/team_news_data.json site/team_news_state.json site/index.html || true
            if git diff --staged --quiet; then
              return 0
            fi
            git commit -m "Refresh scheduled team-news graphics."
            for attempt in 1 2 3; do
              git pull --rebase && git push && return 0
              sleep 5
            done
            echo "::warning::team-news push failed"
          }

          deadline=$(( $(date +%s) + 345 * 60 ))
          while :; do
            echo "::group::poll $(date -u +%H:%MZ)"
            python3 site/fetch_team_news.py --active-only || echo "::warning::fetch_team_news exited non-zero"
            commit_if_changed
            echo "::endgroup::"

            next=$(python3 site/fetch_team_news.py --next-poll | tail -n1)
            if [ "$next" = "none" ] || ! [ "$next" -eq "$next" ] 2>/dev/null; then
              echo "No more checkpoints within horizon — done."
              break
            fi
            [ "$next" -lt 60 ] && next=60
            if [ $(( $(date +%s) + next )) -gt "$deadline" ]; then
              echo "Next checkpoint in ${next}s is past this run's deadline — leaving it to the next run."
              break
            fi
            echo "Sleeping ${next}s until next checkpoint."
            sleep "$next"
          done
